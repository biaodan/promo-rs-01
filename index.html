<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savetnik je dodeljen</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .card { 
            text-align: center; 
            width: 88%; 
            max-width: 350px; 
            background: white; 
            padding: 40px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
        }
        .ws-icon { width: 65px; height: 65px; background: #25D366; color: white; font-size: 35px; line-height: 65px; border-radius: 50%; margin: 0 auto 20px; display: block; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #1c1e21; width: 100%; }
        .text { font-size: 15px; color: #606770; line-height: 1.5; margin-bottom: 30px; width: 100%; box-sizing: border-box; }
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #25D366; 
            color: white; 
            text-decoration: none; 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 17px; 
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); 
            border: none; 
            width: 100%;            
            max-width: 280px;      
            margin: 0 auto;        
            cursor: pointer; 
            box-sizing: border-box; 
        }
        .btn:before { content: '💬'; margin-right: 8px; font-size: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="ws-icon">✓</div>
        <div class="title">Savetnik je dodeljen!</div>
        <div class="text">
            Vaš zahtev je uspešno obrađen. Kliknite na dugme ispod da nas <b>kontaktirate odmah</b> za više informacija:
        </div>
        <!-- 塞尔维亚专用分流链接 -->
        <a href="https://lihi1.me/msOKm" class="btn">KONTAKTIRAJTE NAS SAD</a>
    </div>
</body>
</html>
